[project]
name = "big-integer-nth-root"
version = "0.1.0"
description = "Computes the integer floor of the kth root of an arbitrarily large integer via a Newton iteration adapted for integers."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
